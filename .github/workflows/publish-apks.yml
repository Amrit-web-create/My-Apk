name: Publish APKs to Releases & Update README

on:
  push:
    branches: [ main ]
    paths:
      - 'apk/**'
      - 'publish_apks.py'
      - 'README.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish APKs from apk/ folder to GitHub Releases and update README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python publish_apks.py

      - name: Commit and push updated README.md and apk folder state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .apk_store_state.json apk/
          git commit -m "chore: publish APK release assets and update README.md" || exit 0
          git push
          
